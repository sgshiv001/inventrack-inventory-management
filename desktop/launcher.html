<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'">
  <title>InvenTrack — choose how to work</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <main>
    <div class="launcher-brand"><span class="launcher-mark" aria-hidden="true">▥</span> InvenTrack<span>.</span></div>
    <p class="eyebrow">A SPACE FOR YOUR NEXT MOVE</p>
    <h1>Find your focus.<br><em>Choose your space.</em></h1>
    <p class="lede">Open your workspace in a dedicated window or your browser. Your inventory stays connected on this computer.</p>
    <div class="choices">
      <button id="desktop" type="button"><span class="symbol">▣</span><strong>Windows app</strong><small>Open the inventory in a dedicated desktop window.</small></button>
      <button id="browser" type="button"><span class="symbol">◎</span><strong>Web browser</strong><small>Open the same local workspace in your default browser.</small></button>
    </div>
    <p id="status" role="status"></p>
    <button id="backup" type="button" hidden>Back up workspace</button>
    <p id="databasePath" class="note"></p>
    <p class="note">Keep this launcher open while you work in the browser. Create your account or sign in on the welcome page.</p>
  </main>
  <script src="launcher.js"></script>
</body>
</html>
