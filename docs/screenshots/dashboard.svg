<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">InvenTrack executive dashboard preview</title>
  <desc id="desc">Midnight indigo inventory dashboard with KPI cards, stock chart, alerts, and operations summary.</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1"><stop stop-color="#272451"/><stop offset="1" stop-color="#3b3984"/></linearGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop stop-color="#5b5ce2"/><stop offset="1" stop-color="#18c8d8"/></linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#f6f7fb"/>
  <rect width="232" height="900" fill="#17182b"/>
  <rect x="28" y="32" width="40" height="40" rx="10" fill="url(#bar)"/><text x="48" y="58" fill="white" font-family="Arial" font-size="16" text-anchor="middle" font-weight="700">IT</text>
  <text x="82" y="52" fill="#fff" font-family="Arial" font-size="18" font-weight="700">InvenTrack</text><text x="82" y="70" fill="#a9afc7" font-family="Arial" font-size="9" letter-spacing="1.5">OPERATIONS WORKSPACE</text>
  <g font-family="Arial" font-size="14"><rect x="18" y="125" width="196" height="46" rx="8" fill="#292b52"/><text x="48" y="153" fill="#e0e1ff">D</text><text x="72" y="153" fill="#fff" font-weight="700">Dashboard</text><text x="48" y="202" fill="#a9afc7">P</text><text x="72" y="202" fill="#a9afc7">Products</text><text x="48" y="251" fill="#a9afc7">T</text><text x="72" y="251" fill="#a9afc7">Shipping &amp; tracking</text><text x="48" y="300" fill="#a9afc7">A</text><text x="72" y="300" fill="#a9afc7">Admin insights</text><text x="48" y="349" fill="#a9afc7">L</text><text x="72" y="349" fill="#a9afc7">Log book</text></g>
  <text x="270" y="54" fill="#171a2b" font-family="Arial" font-size="25" font-weight="700">Dashboard</text><text x="270" y="78" fill="#687089" font-family="Arial" font-size="13">A clear view of your inventory today.</text>
  <rect x="1195" y="36" width="110" height="34" rx="7" fill="#e8fbf8"/><text x="1250" y="58" fill="#168b9a" font-family="Arial" font-size="12" text-anchor="middle">Database synced</text><rect x="1320" y="36" width="90" height="34" rx="7" fill="#eef0ff"/><text x="1365" y="58" fill="#4c4fc5" font-family="Arial" font-size="12" text-anchor="middle">Admin</text>
  <rect x="270" y="112" width="1140" height="190" rx="14" fill="url(#hero)"/><text x="302" y="148" fill="#9ef4f0" font-family="Arial" font-size="11" letter-spacing="2">HOME · 17 SEPTEMBER 2026</text><text x="302" y="195" fill="#fff" font-family="Arial" font-size="38" font-weight="700">A clear picture.</text><text x="302" y="235" fill="#b9baff" font-family="Arial" font-size="38" font-weight="700">A better next move.</text><rect x="1000" y="170" width="350" height="54" rx="8" fill="#fff" fill-opacity=".14" stroke="#7779d1"/><text x="1022" y="203" fill="#c9cbed" font-family="Arial" font-size="14">Search products, SKUs, or categories...</text><rect x="1235" y="177" width="104" height="40" rx="6" fill="#5b5ce2"/><text x="1287" y="202" fill="#fff" font-family="Arial" font-size="13" text-anchor="middle">Search</text>
  <g font-family="Arial"><g><rect x="270" y="328" width="216" height="116" rx="10" fill="#fff" stroke="#dfe3ee"/><text x="292" y="357" fill="#687089" font-size="12">Total products</text><text x="292" y="398" fill="#4c4fc5" font-size="32" font-weight="700">6</text><text x="292" y="423" fill="#687089" font-size="12">3 categories</text></g><g><rect x="500" y="328" width="216" height="116" rx="10" fill="#fff" stroke="#dfe3ee"/><text x="522" y="357" fill="#687089" font-size="12">Units in stock</text><text x="522" y="398" fill="#168b9a" font-size="32" font-weight="700">145</text><text x="522" y="423" fill="#687089" font-size="12">Across all products</text></g><g><rect x="730" y="328" width="216" height="116" rx="10" fill="#fff" stroke="#dfe3ee"/><text x="752" y="357" fill="#687089" font-size="12">Low stock</text><text x="752" y="398" fill="#c87720" font-size="32" font-weight="700">3</text><text x="752" y="423" fill="#687089" font-size="12">Needs attention</text></g><g><rect x="960" y="328" width="216" height="116" rx="10" fill="#fff" stroke="#dfe3ee"/><text x="982" y="357" fill="#687089" font-size="12">Inventory value</text><text x="982" y="398" fill="#4c4fc5" font-size="27" font-weight="700">₹1.1L</text><text x="982" y="423" fill="#687089" font-size="12">At cost price</text></g><g><rect x="1190" y="328" width="220" height="116" rx="10" fill="#fff" stroke="#dfe3ee"/><text x="1212" y="357" fill="#687089" font-size="12">Market value</text><text x="1212" y="398" fill="#168b9a" font-size="27" font-weight="700">₹1.5L</text><text x="1212" y="423" fill="#687089" font-size="12">At selling price</text></g></g>
  <rect x="270" y="474" width="650" height="286" rx="10" fill="#fff" stroke="#dfe3ee"/><text x="296" y="511" fill="#171a2b" font-family="Arial" font-size="17" font-weight="700">Stock by category</text><text x="296" y="535" fill="#687089" font-family="Arial" font-size="12">Current units across your catalogue</text><g font-family="Arial" font-size="13"><text x="296" y="583" fill="#687089">Electronics</text><rect x="420" y="570" width="390" height="16" rx="8" fill="#edf0f7"/><rect x="420" y="570" width="260" height="16" rx="8" fill="url(#bar)"/><text x="830" y="584" fill="#171a2b">35</text><text x="296" y="635" fill="#687089">Stationery</text><rect x="420" y="622" width="390" height="16" rx="8" fill="#edf0f7"/><rect x="420" y="622" width="330" height="16" rx="8" fill="url(#bar)"/><text x="830" y="636" fill="#171a2b">64</text><text x="296" y="687" fill="#687089">Furniture</text><rect x="420" y="674" width="390" height="16" rx="8" fill="#edf0f7"/><rect x="420" y="674" width="80" height="16" rx="8" fill="url(#bar)"/><text x="830" y="688" fill="#171a2b">4</text></g>
  <rect x="946" y="474" width="464" height="286" rx="10" fill="#fff" stroke="#dfe3ee"/><text x="972" y="511" fill="#171a2b" font-family="Arial" font-size="17" font-weight="700">Low-stock alerts</text><text x="972" y="535" fill="#687089" font-family="Arial" font-size="12">Products at or below reorder level</text><g font-family="Arial"><rect x="972" y="566" width="412" height="52" rx="6" fill="#fff8f0"/><text x="990" y="588" fill="#171a2b" font-size="13" font-weight="700">Desk Organizer</text><text x="990" y="606" fill="#687089" font-size="11">STAT-044 · Reorder at 6</text><text x="1318" y="598" fill="#b74456" font-size="13" font-weight="700">0 left</text><rect x="972" y="632" width="412" height="52" rx="6" fill="#fff8f0"/><text x="990" y="654" fill="#171a2b" font-size="13" font-weight="700">Ergonomic Office Chair</text><text x="990" y="672" fill="#687089" font-size="11">FURN-005 · Reorder at 5</text><text x="1318" y="664" fill="#c87720" font-size="13" font-weight="700">4 left</text><rect x="972" y="698" width="412" height="38" rx="6" fill="#eef0ff"/><text x="1178" y="722" fill="#4c4fc5" font-size="12" text-anchor="middle" font-weight="700">Review reorder plan →</text></g>
</svg>
